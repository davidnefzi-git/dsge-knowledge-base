  derivation: docs/theory/two-sector-housing-production.md#factor-demands
- id: housing-labour-demand-impatient
  expr: w_h_impatient+n_h_impatient-q_h-inv_h
  description: Housing-sector factor demand for household-specific labour.
  status: derived
  source_check: verified_primary
  source: Iacoviello and Neri (2010), Appendix B22-B23, printed p.161
  derivation: docs/theory/two-sector-housing-production.md#factor-demands
- id: goods-capital-demand
  expr: rk_c+u_c+k_c(-1)-y_c+x_price
  description: Goods-sector capital-service rental demand.
  status: derived
  source_check: verified_primary
  source: Iacoviello and Neri (2010), Appendix B24, printed p.161
  derivation: docs/theory/two-sector-housing-production.md#factor-demands
- id: housing-capital-demand
  expr: rk_h+u_h+k_h(-1)-q_h-inv_h
  description: Housing-sector capital-service rental demand.
  status: derived
  source_check: verified_primary
  source: Iacoviello and Neri (2010), Appendix B25, printed p.161
  derivation: docs/theory/two-sector-housing-production.md#factor-demands
- id: flex-price
