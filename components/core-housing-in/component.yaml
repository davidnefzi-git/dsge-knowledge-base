  derivation: docs/theory/two-sector-housing-production.md#factor-demands
- id: housing-labour-demand-patient
  expr: w_h_patient+n_h_patient-q_h-inv_h
  description: Housing-sector factor demand for household-specific labour.
  status: derived
  source_check: verified_primary
  source: Iacoviello and Neri (2010), Appendix B22-B23, printed p.161
  derivation: docs/theory/two-sector-housing-production.md#factor-demands
- id: goods-labour-demand-impatient
  expr: w_c_impatient+n_c_impatient-y_c+x_price
  description: Goods-sector factor demand for household-specific labour.
  status: derived
  source_check: verified_primary
