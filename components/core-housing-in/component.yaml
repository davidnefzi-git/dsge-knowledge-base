- id: housing-stock
  expr: in_qhpy*h_patient+in_qhiy*h_impatient-(1-delta_housing)/in_growth_h*(in_qhpy*h_patient(-1)+in_qhiy*h_impatient(-1))-in_qiy*inv_h
