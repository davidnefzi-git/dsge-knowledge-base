  - housing-capital-demand
  - flex-price
  - flex-wage-c-patient
  - flex-wage-h-patient
  - flex-wage-c-impatient
  - flex-wage-h-impatient
  - fixed-utilisation-c
  - fixed-utilisation-h
  - marginal-utility-no-habit-patient
  - marginal-utility-no-habit-impatient
