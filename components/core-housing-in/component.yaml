  - housing-capital-investment
  - aggregate-business-investment
  - expenditure-gdp
  - aggregate-hours
  - aggregate-real-wage
  statement: Variables are stationary log deviations from the deterministic balanced-growth path; household-specific
    discounting and sector-specific trends are retained.
  substituting: An occasionally binding constraint or nonlinear global solution requires a separate specification.
- id: two-household-asset-structure
  status: canonical
  embodied_in:
  - borrower-budget
  - patient-bond
  statement: Patient households own capital and fixed land and lend to impatient households; the latter
    own housing but no productive capital.
  substituting: A representative household removes the collateral transmission channel and changes budgets
    and steady-state coefficients.
- id: fixed-land-and-intermediates
  status: canonical
  embodied_in:
  - housing-production
  statement: Land is fixed at one and material inputs satisfy their static optimality condition. Their
    rents and quantities are eliminated algebraically.
  substituting: An elastic land supply requires a separate stock, price and rent system.
- id: expenditure-gdp-convention
  status: library
  embodied_in:
  - expenditure-gdp
  - goods-resource
  statement: Expenditure GDP follows footnote 15. Goods resources retain utilisation costs derived from
    the household budgets.
  substituting: Appendix B33 and B34 have different aggregate accounting conventions once utilisation
    costs are retained; that alternative requires a coherent change in resource and GDP definitions.
verification:
  reviewed_by: null
  notes: Budget-consistent first-order interpretation of the published household conditions. The B34 omission
    of utilisation costs and the B33 versus footnote-15 GDP definitions are resolved explicitly; adapted
    equations identify these choices. Fixed-land rents and both bond positions are eliminated algebraically,
    not absent economically.
  open_questions:
  - The printed B34 resource equation omits utilisation costs present in B1. The budget-consistent version
    is used.
  - Expenditure GDP follows footnote 15; with utilisation costs it differs from the value-added expression
    beside B33.
