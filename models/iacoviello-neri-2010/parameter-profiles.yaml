model: iacoviello-neri-2010
default: paper-posterior-mean
interpretation: >
  Both profiles use the same budget-consistent economic equations documented in
  spec/model.md. A parameter profile changes coefficients, not the economic reading
  of a source equation. Neither profile is an estimate produced by this library.

profiles:
  paper-posterior-mean:
    source: Iacoviello and Neri (2010), Tables 1, 3 and 4
    precision: Published posterior means at printed precision; fixed calibration from Table 1.
    overrides: {}
  numerical-reference:
    source: Iacoviello and Neri public Dynare reference, hard-coded mean coefficients
    interpretation: >
      These values differ from published means. The normalisation of the persistent
      inflation-objective state is converted to natural log units; no economic
      equation is changed by selecting this profile.
    overrides:
      alpha_patient: 0.79343
      habit_patient: 0.31423
      habit_impatient: 0.56897
      eta_patient: 0.52381
      eta_impatient: 0.50602
      phi_k_c: 14.47013
      phi_k_h: 11.02808
      iota_p_in: 0.69106
      iota_w_c_in: 0.08301
      iota_w_h_in: 0.41186
      xi_patient: 0.6833
      xi_impatient: 0.96538
      phi_pi_in: 1.40444
      rho_i_in: 0.59913
      phi_growth_in: 0.51261
      theta_p_in: 0.83671
      theta_w_c_in: 0.79204
      theta_w_h_in: 0.91181
      gamma_ac_in: 0.0032
      gamma_ah_in: 0.0008
      gamma_ak_in: 0.00275
      zeta_in: 0.70394
      rho_c_in: 0.94265
      rho_h_in: 0.99713
      rho_j_in: 0.95875
      rho_k_in: 0.92384
      rho_tau_in: 0.92158
      rho_z_in: 0.96439
