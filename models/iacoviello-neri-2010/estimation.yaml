parameter_profiles:
  paper-posterior-mean:
    interpretation: Canonical default, using the rounded means in Tables 3–4. Percent-scaled technology growth
      parameters are divided by 100.
    equations: 'Budget-consistent interpretation: primary-source habit derivative, intended housing-sector
      wage slope, and net utilisation accounting; see spec/model.md.'
    growth_convention: Technology trend means divided by 100 are used as log-growth coefficients; gross growth
      is exp(weighted trend), matching the reference convention and the paper to first order in net growth.
  numerical-reference:
    interpretation: Separate diagnostic profile; values reflect a distinct numerical reference, not extra precision
      for the article means.
    growth_convention: Technology trend means divided by 100 are used as log-growth coefficients; gross growth
      is exp(weighted trend), matching the reference convention and the paper to first order in net growth.
    habit_convention: This parameter profile uses the same corrected primitive-utility derivative as the default.
      The original numerical programme instead factors the current preference shock outside both derivative
      terms.
    inflation_objective_scaling: Reference innovation is multiplied by 100, with its state divided by 100 in
      the monetary rule.
    estimation_configuration:
      mh_replic: 5000
      mh_jscale: 0.2
      mh_nblocks: 1
      presample: 4
      mode_compute: 4
      lik_init: 1
      housing_technology_persistence_prior_sd: 0.09
