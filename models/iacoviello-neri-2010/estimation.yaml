# Published empirical reference; posterior values are not estimates generated by this library.
model: iacoviello-neri-2010
reference:
  authors:
  - Iacoviello
  - Neri
  year: 2010
  title: 'Housing Market Spillovers: Evidence from an Estimated DSGE Model'
  publication: 'American Economic Journal: Macroeconomics 2(2), 125–164'
  doi: 10.1257/mac.2.2.125
  pdf_page_convention: One-based physical PDF page equals printed page minus 124.
status: published-reference-only
observations:
  frequency: quarterly
  estimation_sample:
    start: 1965Q1
    end: 2006Q4
    quarters: 168
  source: Section II.A, printed pp. 134–136 (PDF pp. 10–12); Appendix A, printed pp. 158–159 (PDF pp. 34–35)
  units: Natural logs, quarterly rates and deviations; multiply by 100 for percentages. Trends remain in the
    four real series; level information is removed.
  measurement_errors:
  - series: hours_h
    innovation: measurement_hours_h
    distribution: independent zero-mean Gaussian
    sd_table_symbol: sigma_nh
  - series: wage_inflation_h
    innovation: measurement_wage_h
    distribution: independent zero-mean Gaussian
    sd_table_symbol: sigma_wh
  measurement_system:
  - series: consumption
    concept: Real personal consumption expenditure per capita
    source: BEA table 1.1.6, chained 2000 dollars; BLS CNP16OV population
    transformation: Natural log, normalized at initial date; deterministic trend retained
    model_relation: log_G_C*t + c_t
  - series: residential_investment
    concept: Real private residential fixed investment per capita
    source: BEA table 1.1.6, chained 2000 dollars; BLS CNP16OV
    transformation: Natural log, normalized at initial date; deterministic trend retained
    model_relation: log_G_H*t + inv_h_t
  - series: business_investment
    concept: Real private nonresidential fixed investment per capita
    source: BEA table 1.1.6, chained 2000 dollars; BLS CNP16OV
    transformation: Natural log, normalized at initial date; deterministic trend retained
    model_relation: log_G_K*t + inv_t
    restriction: Aggregate chained business investment is assigned the trend of nonhousing-sector capital;
      see footnote 16.
  - series: house_price
    concept: Census constant-quality new one-family house price, including lot
    source: US Census Bureau, deflated by BLS nonfarm-business implicit price deflator
    transformation: Natural log, normalized at initial date; deterministic trend retained
    model_relation: log_G_q*t + q_h_t
  - series: interest_rate
    concept: Three-month Treasury bill secondary-market rate
    source: Federal Reserve H15/RIFSGFSM03_NM
    transformation: Quarterly units; demeaned
    model_relation: i_t
  - series: inflation
    concept: Nonfarm-business implicit price deflator inflation
    source: BLS
    transformation: Quarter-on-quarter log difference; demeaned
    model_relation: pi_t
  - series: hours_c
    concept: Nonconstruction nonfarm payroll employment times weekly production-worker hours, per capita
    source: BLS PAYEMS less USCONS, multiplied by CES0500000005, divided by CNP16OV
    transformation: Log hours; demeaned
    model_relation: alpha_patient*n_c_patient_t + (1-alpha_patient)*n_c_impatient_t
  - series: hours_h
    concept: Construction employment times weekly construction-worker hours, per capita
    source: BLS USCONS times CES2000000005, divided by CNP16OV
    transformation: Log hours; demeaned
    model_relation: alpha_patient*n_h_patient_t + (1-alpha_patient)*n_h_impatient_t + measurement_hours_h_t
  - series: wage_inflation_c
    concept: Nominal wage inflation, private nonfarm production/nonsupervisory workers
    source: BLS CES0500000008
    transformation: Quarterly log change; demeaned
    model_relation: omega_c_t
    aggregation: omega_s_t = omega_weight_patient_s*(w_s_patient_t-w_s_patient_(t-1)) + (1-omega_weight_patient_s)*(w_s_impatient_t-w_s_impatient_(t-1))
      + pi_t; omega_weight_patient_s equals the patient steady wage level divided by the sum of both household
      steady wage levels. Trend nominal wage inflation is removed by demeaning.
  - series: wage_inflation_h
    concept: Nominal wage inflation, construction production/nonsupervisory workers
    source: BLS CES2000000008
    transformation: Quarterly log change; demeaned
    model_relation: omega_h_t + measurement_wage_h_t
    aggregation: omega_s_t = omega_weight_patient_s*(w_s_patient_t-w_s_patient_(t-1)) + (1-omega_weight_patient_s)*(w_s_impatient_t-w_s_impatient_(t-1))
      + pi_t; omega_weight_patient_s equals the patient steady wage level divided by the sum of both household
      steady wage levels. Trend nominal wage inflation is removed by demeaning.
  data_boundaries:
  - The theoretical consumption aggregate excludes imputed housing services and durables; the empirical chain-weighted
    total consumption series is broader (footnote 18).
  - The article defines data sources and transformations but does not provide the original vintage or all construction
    details in Appendix A.
  - Model hours aggregate household labour composites using the patient income weight. Observed payroll hours
    are an empirical counterpart, not an identity for household composition.
  expression_dictionary:
    c: Steady-consumption-share weighted c_patient and c_impatient.
    inv: Steady-investment-share weighted inv_k_c and inv_k_h; these refer to physical capital accumulation.
    inv_h: Residential construction quantity.
    q_h: Relative house price.
    i: Quarterly nominal log-rate deviation.
    pi: Quarterly goods-price log-inflation deviation.
    n_c_patient,n_c_impatient,n_h_patient,n_h_impatient: Household/sector log hours deviations.
    w_c_patient,w_c_impatient,w_h_patient,w_h_impatient: Household/sector real-wage log deviations.
    omega_c,omega_h: Observation auxiliaries for nominal wage inflation; defined above, not additional structural
      shocks.
    log_G_C,log_G_K,log_G_H,log_G_q: Deterministic log growth rates defined in the balanced-growth derivation.
estimation_procedure:
  source: Section II.A and II.D, footnote 26, printed pp. 134,139–140 (PDF pp. 10,15–16)
  approximation: First-order equilibrium after balanced-growth detrending
  likelihood: Gaussian linear state-space likelihood for ten observables, nine structural innovations and two
    measurement errors
  posterior: p(theta | data) proportional to likelihood times the product of the stated priors
  posterior_computation: Random-walk Metropolis; Gaussian jump distribution based on posterior curvature at
    the maximum
  mh:
    reported_draws: 500000
    target_acceptance_rate: 0.25
    proposal_scale: Chosen to obtain approximately 25 percent acceptance; no numeric value stated in the article.
    burn_in: Not specified in the printed article.
    diagnostics:
    - Compare moments from the two halves of the Metropolis draws.
    - Further estimation and convergence details are in the separately published Web Appendix C.
  marginal_likelihood: Not assigned a numerical baseline here; Tables 3–4 report posterior distributions rather
    than a model-comparison likelihood criterion.
  web_appendix_boundary: The printed article and Appendices A/B do not reproduce Web Appendices C/D.
