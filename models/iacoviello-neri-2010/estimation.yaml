published_results:
  source: Sections III–IV, printed pp. 140–158 (PDF pp. 16–34)
  status: Published posterior-dependent findings, not generated estimates.
  objects:
  - 'Figure 2: housing-preference impulse responses; Figure 3: monetary impulse responses; Figure 4: housing-technology impulse responses.'
  - 'Table 5: model business-cycle statistics; Table 6: forecast-error variance decomposition.'
  - 'Figure 6 and Table 7: historical contributions to housing booms.'
  - 'Figure 7 and Table 8: predictability of housing-preference shocks.'
  - 'Section IV, Table 9 and Figures 8–9: collateral spillovers, counterfactuals and subsample comparison.'
  subsamples:
  - 1965Q1–1982Q4
  - 1989Q1–2006Q4
  qualitative_findings:
  - A housing-preference shock raises house prices and residential investment.
  - A housing-technology shock raises residential investment while lowering house prices.
  - A contractionary monetary shock reduces housing activity.
  - Collateral effects amplify consumption responses; their estimated importance rises in the later subsample.
