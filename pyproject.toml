[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dsge-knowledge-base"
version = "0.1.0"
description = "Canonical DSGE knowledge base with structural components, model specifications and validation tools"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "sympy>=1.12", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools]
packages = ["modellib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
