name: DSGE knowledge-base validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  structural-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install solver and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy sympy pyyaml jsonschema pytest
      - name: Validate DSGE knowledge base
        run: python -m pytest -q
